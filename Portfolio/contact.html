<!DOCTYPE html>

        rel="stylesheet"
    >

    <!-- Existing CSS - DO NOT CHANGE -->

<body>

    <!-- Background Decoration -->
    <div class="bg-decor" aria-hidden="true">
        <span class="decor-blob blob-1"></span>
        <span class="decor-blob blob-2"></span>
    </div>


    <!-- =========================
         NAVBAR
    ========================== -->

    <header class="navbar" id="navbar">

        <div class="nav-inner">

            <!-- Logo -->
            <a href="index.html" class="logo">
                Laiba <span>Batool</span>
            </a>


            <!-- Navigation -->
            <nav class="nav-links" id="navLinks">

                <a href="index.html">Home</a>

                <a href="about.html">About</a>

                <a href="skills.html">Skills</a>

                <a href="projects.html">Projects</a>

                <a href="resume.html">Resume</a>

                <!-- CONTACT ACTIVE -->
                <a href="contact.html" class="active">Contact</a>

            </nav>


            <!-- Navbar Actions -->
            <div class="nav-actions">

                <button
                    id="themeToggle"
                    class="theme-toggle"
                    aria-label="Toggle dark mode">
                    🌙
                </button>


                <a
                    href="contact.html"
                    class="btn btn-small btn-primary">
                    Let's Talk →
                </a>


                <button
                    class="nav-burger"
                    id="navBurger"
                    aria-label="Open menu"
                    aria-expanded="false">

                    <span></span>
                    <span></span>
                    <span></span>

                </button>

            </div>

        </div>

    </header>


    <!-- =========================
         CONTACT PAGE
    ========================== -->

    <main>

        <section
            class="contact"
            style="
                min-height: calc(100vh - 170px);
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 90px 32px 70px;
            "
        >

            <div
                style="
                    width: 100%;
                    max-width: 850px;
                    text-align: center;
                "
            >

                <!-- Small Heading -->
                <p
                    class="section-eyebrow center"
                    style="
                        margin-bottom: 14px;
                        color: var(--rose-deep);
                    "
                >
                    Contact
                </p>


                <!-- Main Heading -->
                <h1
                    style="
                        font-family: var(--font-display);
                        font-size: clamp(2.8rem, 6vw, 4.4rem);
                        line-height: 1.1;
                        font-weight: 700;
                        margin-bottom: 20px;
                        color: var(--text);
                    "
                >
                    Let's build something
                    <span style="color: var(--rose-deep);">
                        great
                    </span>
                </h1>


                <!-- Description -->
                <p
                    style="
                        max-width: 620px;
                        margin: 0 auto 36px;
                        color: var(--text-soft);
                        font-size: 1.05rem;
                        line-height: 1.8;
                    "
                >
                    Open to frontend and data analyst roles,
                    freelance projects and collaborations.
                </p>


                <!-- Contact Buttons -->
                <div
                    style="
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        gap: 12px;
                        flex-wrap: wrap;
                    "
                >

                    <!-- Email -->
                    <a
                        href="mailto:slaibanaqvi10@gmail.com"
                        class="btn btn-primary"
                    >
                        ✉️ &nbsp; Email me
                    </a>


                    <!-- GitHub -->
                    <a
                        href="https://github.com/slaibanaqvi10-pro"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="btn btn-outline"
                    >
                        ◉ &nbsp; GitHub
                    </a>


                    <!-- LinkedIn -->
                    <a
                        href="https://www.linkedin.com/in/laiba-batool-3b55a833b"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="btn btn-outline"
                    >
                        in &nbsp; LinkedIn
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="footer">

        <div class="section-inner footer-inner">

            <p>
                🌷 Designed &amp; built by Laiba Batool
            </p>

            <p>
                &copy;
                <span id="year"></span>
                All rights reserved.
            </p>

        </div>

    </footer>


    <!-- Scroll To Top -->
    <button
        id="scrollTop"
        class="scroll-top"
        aria-label="Scroll to top">
        ↑
    </button>

    <script src="script.js"></script>
