<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Skills | Laiba Batool</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

    <style>

        /* =========================
           COLOR PALETTE
        ========================== */

        :root {
            --dusty-rose: #C98FA3;
            --soft-pink: #E8C7D1;
            --lavender: #C9B8D9;
            --off-white: #FAF7F5;
            --charcoal: #29252A;
        }


        /* =========================
           SKILLS PAGE
        ========================== */

        .skills-page {
            min-height: calc(100vh - 160px);
            background: var(--off-white);
            padding: 90px 7% 100px;
        }

        .skills-container {
            max-width: 1100px;
            margin: auto;
        }


        /* Heading */

        .skills-label {
            color: var(--dusty-rose);
            font-family: "Poppins", sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .skills-title {
            font-family: "Playfair Display", serif;
            color: var(--charcoal);
            font-size: clamp(2.8rem, 5vw, 4rem);
            line-height: 1.1;
            margin: 0 0 50px;
        }

        .skills-title span {
            color: var(--dusty-rose);
        }


        /* =========================
           SKILLS GRID
        ========================== */

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }


        /* Skill Card */

        .skill-card {
            background: #FFFFFF;
            border: 1px solid var(--soft-pink);
            border-radius: 22px;
            padding: 28px 25px;

            box-shadow: 0 8px 25px rgba(41, 37, 42, 0.06);

            transition: all 0.3s ease;
        }

        .skill-card:hover {
            transform: translateY(-6px);
            border-color: var(--lavender);
            box-shadow: 0 15px 35px rgba(201, 143, 163, 0.16);
        }


        /* Skill Header */

        .skill-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 25px;
        }


        .skill-icon {
            width: 46px;
            height: 46px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: var(--soft-pink);
            color: var(--charcoal);

            font-size: 20px;
            flex-shrink: 0;
        }


        .skill-name {
            font-family: "Playfair Display", serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--charcoal);
        }


        /* Progress Bar */

        .progress-container {
            width: 100%;
        }

        .progress-bar {
            width: 100%;
            height: 7px;

            background: #EEE4E8;

            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;

            background: linear-gradient(
                90deg,
                var(--dusty-rose),
                var(--lavender)
            );

            border-radius: 20px;
        }


        .skill-percentage {
            display: block;
            text-align: right;

            margin-top: 8px;

            font-family: "Poppins", sans-serif;
            font-size: 12px;
            font-weight: 500;

            color: #756D72;
        }


        /* =========================
           ACTIVE NAV
        ========================== */

        .nav-links a.active {
            color: var(--dusty-rose) !important;
        }

        .nav-links a.active::after {
            width: 100% !important;
            background: var(--dusty-rose) !important;
        }


        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 900px) {

            .skills-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }


        @media (max-width: 600px) {

            .skills-page {
                padding: 65px 22px 80px;
            }

            .skills-grid {
                grid-template-columns: 1fr;
            }

            .skills-title {
                margin-bottom: 35px;
            }

        }

    </style>

</head>
